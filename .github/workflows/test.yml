name: Test OpenDPS Config Tool

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: |
          python -m opendps_config inspect tests/fixtures/synthetic_config.xml
          python -m opendps_config compare tests/fixtures/synthetic_config.xml --build-record examples/build-record.example.txt --readback examples/readback.example.json --output comparison.json
          python -m json.tool comparison.json >/dev/null
